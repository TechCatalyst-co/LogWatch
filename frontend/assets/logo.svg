<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 88" role="img" aria-label="TheLogWatch">
  <!-- Primary lockup (porcelain on midnight): mark + wordmark. Wordmark uses Overpass (Highway Gothic lineage); falls back to a system sans. -->
  <rect width="380" height="88" rx="18" fill="#0B1230"/>
  <g transform="translate(12 12)">
    <rect width="64" height="64" rx="14" fill="#0B1230"/>
    <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#F4F1EA" stroke-opacity=".22" stroke-width="2"/>
    <g fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 13h12l19 19" stroke="#22B14C"/>
      <path d="M9 24h22l9 8" stroke="#2F6BFF"/>
      <path d="M9 40h22l9-8" stroke="#FFC20E"/>
      <path d="M9 51h12l19-19" stroke="#E21D2D"/>
      <path d="M40 32h15" stroke="#F4F1EA"/>
    </g>
    <circle cx="40" cy="32" r="8.5" fill="#F4F1EA" stroke="#0B1230" stroke-width="2"/>
    <circle cx="40" cy="32" r="4" fill="#0B1230"/>
  </g>
  <text x="92" y="57" font-family="Overpass, 'Helvetica Neue', Arial, sans-serif" font-size="36" fill="#F4F1EA" letter-spacing="-0.5"><tspan font-weight="400">The</tspan><tspan font-weight="800">LogWatch</tspan></text>
</svg>
